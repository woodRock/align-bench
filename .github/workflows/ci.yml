name: CI

# Every push and pull request: lint, type-check, and the whole test suite (unit, golden
# bit-identity against the committed tests/golden/*.npz fixtures, and synthetic end-to-end). The
# core is torch-free, so no torch install. The private fish-oil data is not available here, so
# tests marked `real` skip themselves.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  RUFF_VERSION: '0.17.0'
  MYPY_VERSION: '2.4.0'
  TORCH_VERSION: '2.7.1'  # golden job only (warpalign needs torch); same as joint-align's CI

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==$RUFF_VERSION
      - run: ruff check --output-format=github .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" mypy==$MYPY_VERSION
      - run: mypy

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" -c tests/golden/constraints.txt
      - name: Run tests with coverage
        run: python -m coverage run -m pytest --junitxml=junit.xml
      - name: Coverage report (fails under the threshold in pyproject.toml)
        if: always()
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: junit.xml

  golden:
    name: Golden (live, pinned upstreams)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The [golden] extra pulls in torch through warpalign: CPU wheels, no CUDA download.
      - run: pip install torch==$TORCH_VERSION --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,golden]" -c tests/golden/constraints.txt
      - name: Record upstream revisions
        run: python -c "import importlib.metadata as m; [print(d, m.distribution(d).read_text('direct_url.json')) for d in ('warpalign', 'joint-align', 'trustalign')]"
      - run: python -m pytest tests/test_golden.py tests/test_protocols.py -v -rs
      # This platform's fixture, for committing when the pins or constraints change (see CLAUDE.md).
      - if: always()
        run: python scripts/00_make_golden.py
      - if: always()
        run: python scripts/01_make_fair_benchmark_reference.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-fixtures-linux
          path: tests/golden/*.npz

  package:
    name: Package (non-editable install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # A clean venv and a regular (non-editable) install, imported from outside the checkout:
      # catches modules or data missing from the built package, and anything repo-relative.
      - run: python -m venv /tmp/venv
      - run: /tmp/venv/bin/pip install .
      - name: Import from outside the repository
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -c "import alignbench; print(alignbench.__version__)"
          /tmp/venv/bin/python -c "import sys, alignbench; assert 'torch' not in sys.modules"
